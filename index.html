<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Change Changelog</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --error-color: #ff6b6b;
            --success-color: #2ea44f;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        h1 {
            margin: 0;
            color: #fff;
            font-size: 1.8rem;
        }
        .admin-btn {
            background-color: #21262d;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .admin-btn:hover {
            background-color: #30363d;
        }
        /* Modal Window Styling */
        .modal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #8b949e;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #fff;
        }
        .modal h2 {
            margin-top: 0;
            color: #fff;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 0.4rem;
        }
        .modal input[type="text"], 
        .modal input[type="password"],
        .modal textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        .modal input:focus,
        .modal textarea:focus {
            border-color: var(--accent-color);
        }
        .modal-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .modal-btn:hover {
            opacity: 0.9;
        }
        .error-msg {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        /* Posting Terminal Section */
        #posting-terminal {
            display: none;
        }
        .modal textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }
        /* Feed Stream Layout */
        .change-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .change-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 0.5rem;
        }
        .change-description {
            font-size: 1.1rem;
            color: #f0f6fc;
            margin: 0 0 1rem 0;
            white-space: pre-wrap;
        }
        .tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 2rem;
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-color);
        }
        .loading {
            text-align: center;
            color: #8b949e;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-container">
            <h1>🛠️ Code Deployment Logs</h1>
            <button class="admin-btn" id="open-login-modal">Admin Login</button>
        </div>

        <div id="changelog-container">
            <div class="loading">Loading live updates from Firebase...</div>
        </div>
    </div>

    <!-- Login & Posting Hub Modal Window -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">✕</button>
            
            <!-- VIEW 1: Name and Password Authentication Form -->
            <div id="login-section">
                <h2>Admin Verification</h2>
                <div class="error-msg" id="login-error">Incorrect Name or Password.</div>
                <div class="input-group">
                    <label for="admin-name">NAME</label>
                    <input type="text" id="admin-name" autocomplete="off" placeholder="Enter name...">
                </div>
                <div class="input-group">
                    <label for="admin-pass">PASSWORD</label>
                    <input type="password" id="admin-pass" placeholder="Enter password...">
                </div>
                <button class="modal-btn" id="submit-login">Verify Identity</button>
            </div>

            <!-- VIEW 2: The Unlocked Text Transmission Panel -->
            <div id="posting-terminal">
                <h2>Broadcast New Log</h2>
                <div class="input-group">
                    <label for="log-message">UPDATE DESCRIPTION</label>
                    <textarea id="log-message" placeholder="What parts of the codebase did you change?"></textarea>
                </div>
                <button class="modal-btn" id="submit-post" style="background-color: var(--success-color);">Upload Live Entry</button>
            </div>
        </div>
    </div>

        openModalBtn.addEventListener('click', () => {
