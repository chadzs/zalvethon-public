<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Change Changelog</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        h1 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            color: #fff;
        }
        /* Hidden Input Box styling */
        #secret-post-box {
            display: none; /* Stays invisible until W + Enter is pressed */
            margin-bottom: 2rem;
            width: 100%;
        }
        #secret-post-box input {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 2px solid var(--accent-color);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }
        .change-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .change-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 0.5rem;
        }
        .change-description {
            font-size: 1.1rem;
            color: #f0f6fc;
            margin: 0 0 1rem 0;
        }
        .tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 2rem;
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-color);
        }
        .loading {
            text-align: center;
            color: #8b949e;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ My Code Deployment Logs</h1>
        
        <!-- Secret text dashboard input field container -->
        <div id="secret-post-box">
            <input type="text" id="log-text-input" placeholder="Type your change log description and press Enter to post publicly..." autocomplete="off">
        </div>

        <div id="changelog-container">
            <div class="loading">Loading live updates from Firebase...</div>
        </div>
    </div>

    <!-- Firebase System Logic Framework via explicit multi-origin CDN mapping -->
    <script type="module">
        import { initializeApp } from "https://unpkg.com";
        import { getAnalytics } from "https://unpkg.com";
        import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://unpkg.com";

        // Your specific Firebase web infrastructure parameters
        const firebaseConfig = {
            apiKey: "AIzaSyB-iofbUQKwpxNVvSoT8upxIQ7XmarOzL8",
            authDomain: "://firebaseapp.com",
            projectId: "public-zalvethon",
            storageBucket: "public-zalvethon.firebasestorage.app",
            messagingSenderId: "539371240873",
            appId: "1:539371240873:web:bf6e353ca0a1ef10b058b8",
            measurementId: "G-T7SFP06TDZ"
        };

        // Initialize App Connection instances
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const changelogContainer = document.getElementById('changelog-container');
        const secretPostBox = document.getElementById('secret-post-box');
        const logTextInput = document.getElementById('log-text-input');

        // Track combination event properties
        let keysPressed = {};

        window.addEventListener('keydown', (e) => {
            keysPressed[e.key.toLowerCase()] = true;

            // Trigger action hook: 'w' and 'enter' combined sequence mapping
            if (keysPressed['w'] && keysPressed['enter']) {
                e.preventDefault();
                if (secretPostBox) {
                    secretPostBox.style.display = 'block';
                    logTextInput.focus();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            delete keysPressed[e.key.toLowerCase()];
        });

        // Event parser binding to submit standard log schemas down to Firestore 'changes' collection
        if (logTextInput) {
            logTextInput.addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    const textValue = logTextInput.value.trim();
                    if (!textValue) return;

                    try {
                        logTextInput.disabled = true;
                        logTextInput.placeholder = "Uploading to database...";

                        // Public post configuration array matching custom rules structure map
                        await addDoc(collection(db, "changes"), {
                            description: textValue,
                            author: "Public Admin",
                            type: "Manual Update",
                            timestamp: serverTimestamp()
                        });

                        logTextInput.value = '';
                        secretPostBox.style.display = 'none';
                    } catch (error) {
                        console.error("Firestore Error detail: ", error);
                        alert("Could not append log entry. Verify your Firebase console Firestore permissions rules matches.");
                    } finally {
                        logTextInput.disabled = false;
                        logTextInput.placeholder = "Type your change log description and press Enter to post publicly...";
                    }
                }
            });
        }

        // Live stream pipeline binding
        const changesQuery = query(collection(db, "changes"), orderBy("timestamp", "desc"));

        onSnapshot(changesQuery, (snapshot) => {
            if (!changelogContainer) return;

            if (snapshot.empty) {
                changelogContainer.innerHTML = '<div class="loading">No changes found in the "changes" database collection. Hold down W and hit Enter to post your first announcement.</div>';
                return;
            }

            changelogContainer.innerHTML = ''; 

            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString() : 'Just now';
                
                const card = document.createElement('div');
                card.className = 'change-card';
                card.innerHTML = `
                    <div class="change-header">
                        <span>📅 ${date}</span>
                        <span>👤 ${data.author || 'Developer'}</span>
                    </div>
                    <p class="change-description">${data.description || ''}</p>
                    <div>
                        <span class="tag">${data.type || 'Update'}</span>
                    </div>
                `;
                changelogContainer.appendChild(card);
            });
        }, (error) => {
            console.error("Pipeline failure log: ", error);
            if (changelogContainer) {
                changelogContainer.innerHTML = `<div class="loading" style="color: #ff6b6b;">Permission Error: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
