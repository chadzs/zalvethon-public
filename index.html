<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Change Changelog</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --error-color: #ff6b6b;
            --success-color: #2ea44f;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        h1 {
            margin: 0;
            color: #fff;
            font-size: 1.8rem;
        }
        .admin-btn {
            background-color: #21262d;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .admin-btn:hover {
            background-color: #30363d;
        }
        .modal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #8b949e;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #fff;
        }
        .modal h2 {
            margin-top: 0;
            color: #fff;
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 0.4rem;
        }
        .modal input[type="text"], 
        .modal input[type="password"],
        .modal textarea {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        .modal input:focus,
        .modal textarea:focus {
            border-color: var(--accent-color);
        }
        .modal-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .modal-btn:hover {
            opacity: 0.9;
        }
        .error-msg {
            color: var(--error-color);
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        #posting-terminal {
            display: none;
        }
        .modal textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }
        .change-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .change-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 0.5rem;
        }
        .change-description {
            font-size: 1.1rem;
            color: #f0f6fc;
            margin: 0 0 1rem 0;
            white-space: pre-wrap;
        }
        .tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 2rem;
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-color);
        }
        .loading {
            text-align: center;
            color: #8b949e;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-container">
            <h1>🛠️ Code Deployment Logs</h1>
            <button class="admin-btn" id="open-login-modal">Admin Login</button>
        </div>

        <div id="changelog-container">
            <div class="loading">Loading live updates from Firebase...</div>
        </div>
    </div>

    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">✕</button>
            
            <div id="login-section">
                <h2>Admin Verification</h2>
                <div class="error-msg" id="login-error">Incorrect Name or Password.</div>
                <div class="input-group">
                    <label for="admin-name">NAME</label>
                    <input type="text" id="admin-name" autocomplete="off" placeholder="Enter name...">
                </div>
                <div class="input-group">
                    <label for="admin-pass">PASSWORD</label>
                    <input type="password" id="admin-pass" placeholder="Enter password...">
                </div>
                <button class="modal-btn" id="submit-login">Verify Identity</button>
            </div>

            <div id="posting-terminal">
                <h2>Broadcast New Log</h2>
                <div class="input-group">
                    <label for="log-message">UPDATE DESCRIPTION</label>
                    <textarea id="log-message" placeholder="What parts of the codebase did you change?"></textarea>
                </div>
                <button class="modal-btn" id="submit-post" style="background-color: var(--success-color);">Upload Live Entry</button>
            </div>
        </div>
    </div>

        <script type="module">
        import { initializeApp } from "https://unpkg.com";
        import { getAnalytics } from "https://unpkg.com";
        import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, serverTimestamp } from "https://unpkg.com";

        const firebaseConfig = {
            apiKey: "AIzaSyB-iofbUQKwpxNVvSoT8upxIQ7XmarOzL8",
            authDomain: "://firebaseapp.com",
            projectId: "public-zalvethon",
            storageBucket: "public-zalvethon.firebasestorage.app",
            messagingSenderId: "539371240873",
            appId: "1:539371240873:web:bf6e353ca0a1ef10b058b8",
            measurementId: "G-T7SFP06TDZ"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        const changelogContainer = document.getElementById('changelog-container');
        const adminModal = document.getElementById('admin-modal');
        const openModalBtn = document.getElementById('open-login-modal');
        const closeModalBtn = document.getElementById('close-modal');
        
        const loginSection = document.getElementById('login-section');
        const postingTerminal = document.getElementById('posting-terminal');
        const loginError = document.getElementById('login-error');
        
        const adminNameInput = document.getElementById('admin-name');
        const adminPassInput = document.getElementById('admin-pass');
        const logMessageInput = document.getElementById('log-message');
        
        const submitLoginBtn = document.getElementById('submit-login');
        const submitPostBtn = document.getElementById('submit-post');

        openModalBtn.addEventListener('click', () => {
            adminModal.style.display = 'flex';
            loginSection.style.display = 'block';
            postingTerminal.style.display = 'none';
            loginError.style.display = 'none';
            adminNameInput.value = '';
            adminPassInput.value = '';
            adminNameInput.focus();
        });

        const hideModal = () => { adminModal.style.display = 'none'; };
        closeModalBtn.addEventListener('click', hideModal);
        window.addEventListener('click', (e) => { if(e.target === adminModal) hideModal(); });

        submitLoginBtn.addEventListener('click', () => {
            const username = adminNameInput.value.trim();
            const password = adminPassInput.value;

            // Updated credentials check
            if (username === 'chadzs' && password === '200613') {
                loginError.style.display = 'none';
                loginSection.style.display = 'none';
                postingTerminal.style.display = 'block';
                logMessageInput.focus();
            } else {
                loginError.style.display = 'block';
            }
        });

        adminPassInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') submitLoginBtn.click();
        });

        submitPostBtn.addEventListener('click', async () => {
            const postText = logMessageInput.value.trim();
            if (!postText) return;

            try {
                submitPostBtn.disabled = true;
                submitPostBtn.textContent = "Uploading change packet...";

                await addDoc(collection(db, "changes"), {
                    description: postText,
                    author: "chadzs",
                    type: "Verified Push",
                    timestamp: serverTimestamp()
                });

                logMessageInput.value = '';
                hideModal();
            } catch (error) {
                console.error("Firestore Save Error: ", error);
                alert("Upload failed. Verify that your rules allow writing to the changes path.");
            } finally {
                submitPostBtn.disabled = false;
                submitPostBtn.textContent = "Upload Live Entry";
            }
        });

        const changesQuery = query(collection(db, "changes"), orderBy("timestamp", "desc"));

        onSnapshot(changesQuery, (snapshot) => {
            if (!changelogContainer) return;

            if (snapshot.empty) {
                changelogContainer.innerHTML = '<div class="loading">No records found. Click "Admin Login" above to append the initial system release log entry.</div>';
                return;
            }

            changelogContainer.innerHTML = ''; 

            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString() : 'Just now';
                
                const card = document.createElement('div');
                card.className = 'change-card';
                card.innerHTML = `
                    <div class="change-header">
                        <span>📅 ${date}</span>
                        <span>👤 ${data.author || 'Developer'}</span>
                    </div>
                    <p class="change-description">${data.description || ''}</p>
                    <div>
                        <span class="tag">${data.type || 'Update'}</span>
                    </div>
                `;
                changelogContainer.appendChild(card);
            });
        }, (error) => {
            console.error("Cloud tracking channel subscription failed: ", error);
            if (changelogContainer) {
                changelogContainer.innerHTML = `<div class="loading" style="color: var(--error-color);">Connection error detail: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
