<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Logs</title>
<style>
  :root { --bg:#0f1117; --card:#181b24; --line:#262b38; --text:#e7e9ee; --muted:#8b93a7; --accent:#6c8cff; --danger:#ff6c6c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; max-width:720px; margin:0 auto; padding:20px 16px; }
  h1 { font-size:1.3rem; margin:0; }
  main { max-width:720px; margin:0 auto; padding:0 16px 60px; }
  button { background:var(--accent); color:#fff; border:0; padding:9px 16px; border-radius:8px; font-size:.95rem; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--muted); }
  button.danger { background:transparent; color:var(--danger); border:1px solid var(--line); padding:4px 10px; font-size:.8rem; }
  input, textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; margin-bottom:10px; }
  textarea { min-height:110px; resize:vertical; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .log-text { white-space:pre-wrap; word-wrap:break-word; line-height:1.5; }
  .meta { display:flex; justify-content:space-between; align-items:center; margin-top:10px; color:var(--muted); font-size:.8rem; }
  .empty { color:var(--muted); text-align:center; padding:40px 0; }
  .hidden { display:none !important; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal .card { width:100%; max-width:340px; margin:0; }
  .err { color:var(--danger); font-size:.85rem; min-height:1.2em; margin-bottom:8px; }
  .row { display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>
<header>
  <h1>📝 Text Logs</h1>
  <div>
    <button id="openLogin" class="ghost">Admin</button>
    <button id="logoutBtn" class="ghost hidden">Log out</button>
  </div>
</header>

<main>
  <section id="composer" class="card hidden">
    <textarea id="logInput" placeholder="Write a new log..." maxlength="5000"></textarea>
    <div class="row"><button id="postBtn">Post</button></div>
  </section>
  <section id="feed"><div class="empty">Loading…</div></section>
</main>

<div id="loginModal" class="modal hidden">
  <form id="loginForm" class="card" autocomplete="off">
    <h3 style="margin-top:0">Admin login</h3>
    <input id="user" type="text" placeholder="Username" required autocomplete="username">
    <input id="pass" type="password" placeholder="Password" required autocomplete="current-password">
    <div id="loginErr" class="err"></div>
    <div class="row">
      <button type="button" id="cancelLogin" class="ghost">Cancel</button>
      <button type="submit">Log in</button>
    </div>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== 1. PASTE YOUR FIREBASE WEB CONFIG HERE ======
   (Firebase console → Project settings → Your apps → Web app).
   This config is safe to be public; security comes from the Firestore rules. */
const firebaseConfig = {
  apiKey: "AIzaSyB-iofbUQKwpxNVvSoT8upxIQ7XmarOzL8",
  authDomain: "public-zalvethon.firebaseapp.com",
  projectId: "public-zalvethon",
  storageBucket: "public-zalvethon.firebasestorage.app",
  messagingSenderId: "539371240873",
  appId: "1:539371240873:web:bf6e353ca0a1ef10b058b8",
  measurementId: "G-T7SFP06TDZ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// The username is turned into an email for Firebase Auth. No password lives in this file.
const toEmail = u => u.trim().toLowerCase() + "@chadlogs.app";

const $ = id => document.getElementById(id);
const feed = $("feed");

// ---------- Public feed (everyone can see, live) ----------
let lastSnap = null;
function render() {
  feed.replaceChildren();
  if (!lastSnap || lastSnap.empty) { feed.innerHTML = '<div class="empty">No logs yet.</div>'; return; }
  lastSnap.forEach(d => {
    const data = d.data();
    const card = document.createElement("div"); card.className = "card";
    const text = document.createElement("div"); text.className = "log-text"; text.textContent = data.text;
    const meta = document.createElement("div"); meta.className = "meta";
    const time = document.createElement("span");
    time.textContent = data.createdAt ? data.createdAt.toDate().toLocaleString() : "just now";
    meta.appendChild(time);
    if (auth.currentUser) {
      const del = document.createElement("button"); del.className = "danger"; del.textContent = "Delete";
      del.onclick = () => confirm("Delete this log?") && deleteDoc(doc(db, "logs", d.id));
      meta.appendChild(del);
    }
    card.append(text, meta);
    feed.appendChild(card);
  });
}
onSnapshot(query(collection(db, "logs"), orderBy("createdAt", "desc")), snap => {
  lastSnap = snap; render();
}, err => { feed.innerHTML = '<div class="empty">Could not load logs.</div>'; console.error(err); });

// ---------- Admin login ----------
$("openLogin").onclick = () => $("loginModal").classList.remove("hidden");
$("cancelLogin").onclick = () => { $("loginModal").classList.add("hidden"); $("loginErr").textContent = ""; };
$("loginForm").onsubmit = async e => {
  e.preventDefault();
  try {
    await signInWithEmailAndPassword(auth, toEmail($("user").value), $("pass").value);
    $("loginForm").reset(); $("loginErr").textContent = "";
    $("loginModal").classList.add("hidden");
  } catch (err) {
    console.error(err.code, err.message);
    const c = err.code || "";
    $("loginErr").textContent =
      c === "auth/invalid-credential" || c === "auth/invalid-login-credentials" || c === "auth/wrong-password" || c === "auth/user-not-found"
        ? "Wrong username or password, or the admin user doesn't exist in Firebase yet. (" + c + ")"
        : c === "auth/operation-not-allowed" || c === "auth/configuration-not-found"
        ? "Email/Password sign-in isn't enabled in Firebase Authentication. (" + c + ")"
        : c === "auth/too-many-requests"
        ? "Too many attempts. Wait a few minutes and try again. (" + c + ")"
        : "Login failed: " + c;
  }
};
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  const on = !!user;
  $("composer").classList.toggle("hidden", !on);
  $("logoutBtn").classList.toggle("hidden", !on);
  $("openLogin").classList.toggle("hidden", on);
  render();
});

// ---------- Post ----------
$("postBtn").onclick = async () => {
  const text = $("logInput").value.trim();
  if (!text) return;
  $("postBtn").disabled = true;
  try {
    await addDoc(collection(db, "logs"), { text, createdAt: serverTimestamp() });
    $("logInput").value = "";
  } catch (e) { alert("Post failed — are you logged in as admin?"); console.error(e); }
  $("postBtn").disabled = false;
};
</script>
</body>
</html>
